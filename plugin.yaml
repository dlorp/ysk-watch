name: ysk-watch
label: ysk-watch
kind: standalone
version: "0.5.0"
description: >-
  Integrity watcher for autonomous agents and task workers. Deterministic tripwires on every tool
  call (tests weakened, destructive commands, secrets touched, errors swallowed), a capped
  auxiliary-model audit before an edited turn finishes, and an optional completion audit posted as
  a comment on the task. Read-only, never touches the conversation, fails open.
  YSK_WATCH_DISABLE=1 / YSK_WATCH_AUX=0 kill switches.
author: "dlorp"
license: MIT
requires_hermes: ">=0.21.5"
provides_hooks:
  - post_tool_call
  - pre_verify
  - kanban_task_completed
  - subagent_stop
